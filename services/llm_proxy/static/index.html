<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Proxy</title>
<style>
  :root { --bg: #f8fafc; --card: #fff; --border: #e2e8f0; --text: #1e293b;
          --muted: #64748b; --accent: #2563eb; --danger: #dc2626; --green: #059669; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px -apple-system, Arial, sans-serif; background: var(--bg); color: var(--text); }
  .app { max-width: 960px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  nav { display: flex; gap: 2px; margin-bottom: 20px; }
  nav button { padding: 8px 16px; border: 1px solid var(--border); background: var(--card);
               cursor: pointer; font-size: 14px; border-radius: 6px 6px 0 0; }
  nav button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tab { display: none; }
  .tab.active { display: block; }
  table { width: 100%; border-collapse: collapse; background: var(--card);
          border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { background: #f1f5f9; font-weight: 600; }
  .form-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: flex-end; }
  input, select, button { padding: 6px 10px; font-size: 13px; border: 1px solid var(--border);
                          border-radius: 4px; }
  button { cursor: pointer; background: var(--accent); color: #fff; border: none; }
  button.danger { background: var(--danger); }
  button.small { padding: 3px 8px; font-size: 12px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 2px; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 11px; }
  .badge-ok { background: #dcfce7; color: var(--green); }
  .badge-err { background: #fee2e2; color: var(--danger); }
  .toggle { width: 40px; height: 22px; background: #cbd5e1; border-radius: 11px;
            position: relative; cursor: pointer; display: inline-block; vertical-align: middle; }
  .toggle.on { background: var(--green); }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
                   background: #fff; border-radius: 50%; transition: transform 0.15s; }
  .toggle.on::after { transform: translateX(18px); }
  .logs-auto { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
</style>
</head>
<body>
<div class="app">
  <h1>🔀 LLM Proxy</h1>
  <nav>
    <button data-tab="keys" class="active">Ключи</button>
    <button data-tab="providers">Провайдеры</button>
    <button data-tab="settings">Настройки</button>
    <button data-tab="logs">Логи</button>
  </nav>

  <!-- Keys tab -->
  <div id="tab-keys" class="tab active">
    <div class="form-row">
      <div><label>Имя ключа</label><input id="key-name" placeholder="prod"></div>
      <div><label>Провайдер</label><select id="key-provider"></select></div>
      <div><label>API-ключ</label><input id="key-real" type="password" placeholder="sk-..."></div>
      <div><label>Модель по умолчанию</label><input id="key-model" placeholder="deepseek/deepseek-v4-pro"></div>
      <div><label>&nbsp;</label><button onclick="createKey()">Создать</button></div>
    </div>
    <table><thead><tr><th>Имя</th><th>Провайдер</th><th>Модель</th><th>Вкл</th><th></th></tr></thead>
    <tbody id="keys-table"></tbody></table>
  </div>

  <!-- Providers tab -->
  <div id="tab-providers" class="tab">
    <div class="form-row">
      <div><label>Имя</label><input id="prov-name" placeholder="RouterAI"></div>
      <div><label>URL</label><input id="prov-url" placeholder="routerai.ru"></div>
      <div><label>Путь</label><input id="prov-path" placeholder="/api"></div>
      <div><label>Формат</label><select id="prov-format"><option value="anthropic">Anthropic</option><option value="openai" selected>OpenAI</option></select></div>
      <div><label>Порт</label><input id="prov-port" type="number" value="443" style="width:70px"></div>
      <div><label>&nbsp;</label><button onclick="createProvider()">Добавить</button></div>
    </div>
    <table><thead><tr><th>Имя</th><th>URL</th><th>Путь</th><th>Формат</th><th></th></tr></thead>
    <tbody id="providers-table"></tbody></table>
  </div>

  <!-- Settings tab -->
  <div id="tab-settings" class="tab">
    <div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
        <span>Форсировать провайдера/модель:</span>
        <div id="override-toggle" class="toggle" onclick="toggleOverride()"></div>
      </div>
      <div class="form-row">
        <div><label>Ключ для форсирования</label>
        <select id="override-key" onchange="saveOverrideKey()"><option value="">— не выбрано —</option></select></div>
      </div>
      <p style="font-size:12px;color:var(--muted);">
        Когда включено — все запросы идут через выбранного провайдера, игнорируя выбор в 1С.</p>
    </div>
  </div>

  <!-- Logs tab -->
  <div id="tab-logs" class="tab">
    <div class="logs-auto">Автообновление каждые 5 сек.
      <button class="small danger" onclick="clearLogs()" style="margin-left:12px;">Очистить</button>
    </div>
    <table><thead><tr><th>Время</th><th>Ключ</th><th>Провайдер</th><th>Модель</th><th>In</th><th>Out</th><th>мс</th><th>Ошибка</th></tr></thead>
    <tbody id="logs-table"></tbody></table>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
